name: CI Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  test:
    name: Lint & Run Unit Tests
    runs-on: ubuntu-latest

    # Spins up a PostgreSQL database container with pgvector pre-installed
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgrespassword
          POSTGRES_DB: biodiversity_test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flake8 black pytest
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Lint Code (Flake8 & Black)
        run: |
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
          black --check .

      - name: Execute Pytest Suite
        env:
          DATABASE_URL: postgresql://postgres:postgrespassword@localhost:5432/biodiversity_test_db
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          HF_HUB_OFFLINE: "1"
        run: |
          pytest -v