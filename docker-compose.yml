services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: biodiversity-postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: biodiversity
      POSTGRES_USER: biodiversity_user
      POSTGRES_PASSWORD: biodiversity_password

    ports:
      - "5433:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
