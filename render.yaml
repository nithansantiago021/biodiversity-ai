services:
  - type: web
    name: biodiversity-ai-backend
    env: python
    buildCommand: "pip install --no-cache-dir torch --index-url https://download.pytorch.org/whl/cpu && pip install -r requirements.txt"
    startCommand: "uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: biodiversity-db
          property: connectionString
      - key: GROQ_API_KEY
        sync: false

databases:
  - name: biodiversity-db
    databaseName: biodiversity
    user: biodiversity_user