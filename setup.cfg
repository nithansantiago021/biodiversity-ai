[flake8]
max-line-length = 88
# E203/W503 conflict with black's formatting choices around slices and
# line breaks before binary operators -- ignoring them avoids lint/format
# fighting each other.
extend-ignore = E203, W503, E501
exclude = .venv,venv,__pycache__,.git,data

[mypy]
python_version = 3.12
ignore_missing_imports = True
disallow_untyped_defs = False
warn_unused_ignores = True
exclude = (^data/|^venv/|^\.venv/)

# pytest.ini
[tool:pytest]
testpaths = tests
filterwarnings =
    ignore::DeprecationWarning:starlette.testclient
    